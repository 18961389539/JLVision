name: Native recognition registry probe (diagnostic)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-registry:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Query native operator logical names (no operator execution)
        shell: pwsh
        run: |
          dotnet run --project tools/JLVision.RecognitionProbe/JLVision.RecognitionProbe.csproj --configuration Debug -- --start 0 --end 2174 --output artifacts/native-recognition-registry.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify no functional acceptance is claimed
        shell: pwsh
        run: |
          $result = Get-Content artifacts/native-recognition-registry.json -Raw | ConvertFrom-Json
          if ($result.operatorExecutionVerified -ne $false -or $result.restorationReady -ne $false) {
            throw "Registry audit must not assert functional native operator verification."
          }
      - name: Upload registry diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jlv-native-recognition-registry
          path: artifacts/native-recognition-registry.json
          if-no-files-found: warn
