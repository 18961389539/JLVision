name: Recognition dataset acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  labeled-recognition-dataset:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test offline acceptance report rendering and input safety
        run: python tools/test-recognition-report.py
      - name: Build recognition dataset benchmark and test harness
        run: dotnet build tests/JLVision.RecognitionBenchmark.Smoke/JLVision.RecognitionBenchmark.Smoke.csproj --configuration Debug
      - name: Test exact OCR/barcode ground-truth evaluation and synthetic end-to-end decoder
        run: dotnet run --project tests/JLVision.RecognitionBenchmark.Smoke/JLVision.RecognitionBenchmark.Smoke.csproj --configuration Debug --no-build
      - name: Render static offline recognition report
        run: python tools/recognition-report.py --input artifacts/recognition-dataset.synthetic.json --output artifacts/recognition-dataset.synthetic.html
      - name: Validate final HTML content
        shell: pwsh
        run: |
          $html = Get-Content artifacts/recognition-dataset.synthetic.html -Raw
          foreach ($marker in @('SYNTHETIC DEMONSTRATION', 'Wilson 95% upper bound', 'By algorithm', 'By condition', 'Real field accuracy certified:')) {
            if (-not $html.Contains($marker)) { throw "Recognition HTML missing marker: $marker" }
          }
      - name: Upload synthetic acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jlv-recognition-dataset-synthetic-demo
          path: |
            artifacts/recognition-dataset.synthetic.json
            artifacts/recognition-dataset.synthetic.html
          if-no-files-found: warn
