name: Windows x64 validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Audit native operator lifetime scopes
        run: pwsh ./tools/audit-native-scopes.ps1

      - name: Restore
        run: dotnet restore JLVisionLib.slnx

      - name: Build and test (Debug)
        run: dotnet test JLVisionLib.slnx --configuration Debug --no-restore --logger "trx;LogFileName=jlv-test-results.trx"

      - name: Run bounded native stress baseline (Windows x64)
        run: dotnet run --project tools/JLVision.Stress/JLVision.Stress.csproj --configuration Debug -- --iterations 400 --workers 4 --batches 4 --output artifacts/jlv-stress.json

      - name: Package (Release)
        run: dotnet pack JLVisionLib.csproj --configuration Release --no-restore --output artifacts

      - name: Upload native stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jlv-stress-report
          path: artifacts/jlv-stress.json
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jlv-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

      - name: Upload NuGet package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jlv-nuget
          path: artifacts/*.nupkg
          if-no-files-found: error
